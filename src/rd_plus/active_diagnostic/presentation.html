<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD++ Active Diagnostic Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 16px 32px; border-bottom: 1px solid #30363d; }
.header h1 { font-size: 1.3rem; color: #58a6ff; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
.panel h3 { color: #58a6ff; font-size: .85rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }

.image-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.image-grid .card { background: #161b22; border: 2px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; transition: all .2s; text-align: center; }
.image-grid .card:hover { border-color: #58a6ff; }
.image-grid .card.active { border-color: #7ee787; }
.image-grid .card img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
.image-grid .card .label { font-size: .7rem; color: #8b949e; margin-top: 3px; }

.mid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
#heatmapContainer { text-align: center; min-height: 300px; display: flex; flex-direction: column; }
#heatmapContainer img { max-width: 100%; max-height: 300px; border-radius: 8px; margin: auto; }
#heatmapPlaceholder { color: #8b949e; font-size: .85rem; margin: auto; padding: 40px; }

#reasoningChain { min-height: 300px; overflow-y: auto; }
#reasoningChain .step { padding: 10px; border-left: 3px solid #30363d; margin-bottom: 6px; font-size: .82rem; }
#reasoningChain .step .turn { color: #f59e0b; font-weight: 600; font-size: .72rem; }
#reasoningChain .step .data { color: #e6edf3; margin-top: 2px; }

#verdictDisplay table { width: 100%; font-size: .85rem; }
#verdictDisplay td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
#verdictDisplay td:first-child { color: #8b949e; width: 110px; }
#verdictDisplay .defect { color: #f59e0b; font-weight: 700; font-size: 1.1rem; }
#verdictDisplay .high { color: #f85149; }
#verdictDisplay .medium { color: #f59e0b; }
#verdictDisplay .low { color: #7ee787; }

.status-bar { padding: 8px 20px; background: #161b22; border-top: 1px solid #30363d; text-align: center; font-size: .8rem; color: #8b949e; }
.status-bar .running { color: #58a6ff; }
.status-bar .done { color: #7ee787; }
</style>
</head>
<body>
<div class="header"><h1>🔬 RD++ Active Diagnostic Demo</h1></div>

<div class="wrap">
  <div class="panel">
    <h3>📷 Select Image</h3>
    <div class="image-grid">
      <div class="card" onclick="analyze(this,'bottle','bottle/test/broken_large/000.png')">
        <img id="t1" src=""><div class="label">Bottle — broken large</div>
      </div>
      <div class="card" onclick="analyze(this,'bottle','bottle/test/contamination/000.png')">
        <img id="t2" src=""><div class="label">Bottle — contamination</div>
      </div>
      <div class="card" onclick="analyze(this,'capsule','capsule/test/crack/000.png')">
        <img id="t3" src=""><div class="label">Capsule — crack</div>
      </div>
      <div class="card" onclick="analyze(this,'capsule','capsule/test/poke/000.png')">
        <img id="t4" src=""><div class="label">Capsule — poke</div>
      </div>
      <div class="card" onclick="analyze(this,'carpet','carpet/test/cut/000.png')">
        <img id="t5" src=""><div class="label">Carpet — cut</div>
      </div>
      <div class="card" onclick="analyze(this,'carpet','carpet/test/color/000.png')">
        <img id="t6" src=""><div class="label">Carpet — color</div>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="panel" id="heatmapContainer">
      <h3>🔥 Heatmap</h3>
      <img id="heatmapImg" src="" style="display:none">
      <div id="heatmapPlaceholder">Select an image</div>
    </div>
    <div class="panel" id="reasoningChain">
      <h3>🧠 Reasoning Chain</h3>
      <div style="color:#8b949e;font-size:.82rem;text-align:center;padding:40px">Waiting for analysis...</div>
    </div>
  </div>

  <div class="panel" id="verdictDisplay">
    <h3>⚖️ Verdict</h3>
    <div id="verdictContent"><div style="color:#8b949e;font-size:.85rem;padding:10px">—</div></div>
  </div>
</div>

<div class="status-bar" id="statusBar">Select an image to begin</div>

<script>
const API = 'http://localhost:8000';
document.querySelectorAll('.card').forEach(card => {
  const m = card.getAttribute('onclick').match(/analyze\([^,]+,'([^']+)','([^']+)'\)/);
  if (m) card.querySelector('img').src = API + '/presentation_image?path=' + encodeURIComponent(m[2]);
});

async function analyze(el, category, imagePath) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('statusBar').textContent = 'Running RD++ analysis...';
  document.getElementById('statusBar').className = 'status-bar running';
  document.getElementById('heatmapPlaceholder').textContent = '⏳ Analyzing...';
  document.getElementById('heatmapImg').style.display = 'none';
  document.getElementById('reasoningChain').innerHTML = '<div style="color:#8b949e;text-align:center;padding:40px">⏳ Analyzing...</div>';
  document.getElementById('verdictContent').innerHTML = '<div style="color:#8b949e;padding:10px">⏳</div>';

  try {
    const r = await fetch(`${API}/analyze_simple`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({category, image_path: imagePath, ground_truth: ''})
    });
    const d = await r.json();
    if (d.heatmap_image) { document.getElementById('heatmapImg').src = d.heatmap_image; document.getElementById('heatmapImg').style.display = 'block'; document.getElementById('heatmapPlaceholder').textContent = ''; }
    const z = d.max_z || 0, v = d.verdict || {};
    const steps = [
      {turn: 'Turn 1 — RD++ Forward Pass', data: `Anomaly map generated. Peak z-score: ${z.toFixed(1)}σ`},
      {turn: 'Turn 2 — Z-Score Calibration', data: `Interpretation: ${z>3?'clear defect':z>2?'suspicious':'normal'} (threshold: 2.0σ)`},
      {turn: 'Turn 3 — Heuristic Pre-filter', data: `Top hypothesis: ${v.defect_type||'unknown'} (confidence: ${((v.confidence||0)*100).toFixed(0)}%)`},
      {turn: 'Turn 4 — LLM Diagnosis', data: `Predicted defect: ${v.defect_type||'unknown'}`},
      {turn: v.action==='flag_human'?'⚠ Flagged for Review':'✓ Auto-Accepted', data: v.question||'Verdict ready'},
    ];
    document.getElementById('reasoningChain').innerHTML = steps.map(s => `<div class="step"><div class="turn">${s.turn}</div><div class="data">${s.data}</div></div>`).join('');
    const sev = v.severity||'medium';
    document.getElementById('verdictContent').innerHTML = `<table>
      <tr><td>Defect</td><td class="defect">${v.defect_type||'—'}</td></tr>
      <tr><td>Confidence</td><td>${((v.confidence||0)*100).toFixed(0)}%</td></tr>
      <tr><td>Severity</td><td class="${sev}">${v.severity||'—'}</td></tr>
      <tr><td>Eliminated</td><td>${(v.eliminated_types||[]).join(', ')||'none'}</td></tr>
      <tr><td>Action</td><td>${v.action||'—'}</td></tr>
    </table>`;
    document.getElementById('statusBar').textContent = '✓ Analysis complete';
    document.getElementById('statusBar').className = 'status-bar done';
  } catch(e) {
    document.getElementById('statusBar').textContent = '✗ Error: ' + (e.message||'connection failed');
    document.getElementById('reasoningChain').innerHTML = '<div style="color:#f85149;padding:20px">Error: ' + (e.message||'unknown') + '</div>';
  }
}
</script>
</body>
</html>
